{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<section class="section"><div class="container auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back</h1><p class="muted">Log in to manage your appointments and chat history.</p>
    <form method="post" action="{{ url_for('login_post') }}" class="form" data-loading>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-toggle-pw="password" aria-label="Show password">👁</button></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="muted center">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>
</div></section>
{% endblock %}
